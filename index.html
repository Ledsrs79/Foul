<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magnolia Scout - Feedback</title>
    <style>
        :root { --bg: #000a1a; --magnolia: #002d5d; --red-mag: #e30613; --text: #ffffff; --warn: #ffcc00; }
        body { font-family: 'Arial Black', sans-serif; background-color: var(--bg); background-image: url('https://www.magnoliabasket.it/wp-content/uploads/2019/08/magnoliaicon.png'); background-repeat: no-repeat; background-position: center center; background-attachment: fixed; background-size: 80%; color: var(--text); padding: 5px; margin: 0; }
        body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 10, 26, 0.88); z-index: -1; }
        
        /* Notifica Vocale */
        #voice-status { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 1px solid var(--red-mag); padding: 5px 15px; border-radius: 20px; z-index: 2000; font-size: 0.8rem; display: none; color: var(--warn); }

        #setup-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .setup-card { background: #001530; padding: 15px; border-radius: 15px; border: 2px solid var(--magnolia); margin-bottom: 15px; }
        .setup-title { color: var(--text); margin: 0 0 10px 0; font-size: 0.9rem; text-transform: uppercase; border-left: 4px solid var(--red-mag); padding-left: 10px; }
        .dashboard { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-bottom: 10px; }
        .bonus-box { background: rgba(0, 21, 48, 0.8); border-radius: 8px; text-align: center; padding: 8px; border: 2px solid var(--magnolia); flex: 1; height: 60px; }
        .bonus-box b { font-size: 2rem; display: block; line-height: 1; }
        .bonus-box span { font-size: 0.5rem; text-transform: uppercase; color: #aaa; }
        .is-bonus { background: var(--red-mag) !important; }
        .actions { display: flex; gap: 5px; }
        .btn-ctrl { background: var(--magnolia); border: none; color: white; border-radius: 8px; width: 45px; height: 45px; font-size: 1.2rem; }
        .btn-voice { background: #28a745; }
        .btn-voice.listening { background: var(--red-mag); animation: pulse 0.6s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        .court { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .p-card { display: flex; background: rgba(0, 21, 48, 0.7); border-radius: 10px; margin-bottom: 6px; border: 1px solid var(--magnolia); height: 70px; }
        .p-data { flex-grow: 1; display: flex; align-items: center; justify-content: space-around; }
        .p-num { font-size: 2rem; font-weight: 900; }
        .p-fouls { font-size: 2.5rem; font-weight: 900; color: var(--red-mag); }
        .warning { border: 2px solid var(--warn); }
        .warning .p-fouls { color: var(--warn); }
        .out { background: var(--red-mag) !important; opacity: 0.8; }
        .btn-p { border: none; color: white; width: 40px; font-weight: bold; font-size: 1.2rem; }
        .btn-plus { background: var(--magnolia); height: 100%; flex: 1; }
        .btn-min { background: rgba(0,0,0,0.3); height: 100%; flex: 1; font-size: 0.8rem; color: #777; }
        .p-btns { display: flex; flex-direction: column; width: 40px; }
        .setup-row { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
        input[type="text"] { background: #000; border: 1px solid var(--magnolia); color: #fff; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="voice-status"></div>

    <div id="setup-overlay">
        <div class="setup-card">
            <h3 class="setup-title">AVVERSARI</h3>
            <input type="text" id="opp-name-input" placeholder="Nome squadra..." oninput="oppN=this.value;save()">
        </div>
        <div class="setup-card">
            <h3 class="setup-title">MAGNOLIA</h3>
            <div id="setup-list-my"></div>
            <button onclick="addP('my')" style="width:100%; background:none; color:#4CAF50; border:1px dashed #4CAF50; padding:10px; margin-top:5px;">+ AGGIUNGI</button>
        </div>
        <div class="setup-card">
            <h3 class="setup-title">AVVERSARI</h3>
            <div id="setup-list-opp"></div>
            <button onclick="addP('opp')" style="width:100%; background:none; color:#4CAF50; border:1px dashed #4CAF50; padding:10px; margin-top:5px;">+ AGGIUNGI</button>
        </div>
        <button onclick="closeSetup()" style="background:var(--red-mag); color:white; padding:15px; border:none; border-radius:10px; font-weight:bold;">VAI AL CAMPO</button>
        <button onclick="fullReset()" style="background:#444; color:red; border:none; padding:10px; margin-top:20px; border-radius:10px;">RESET FALLI</button>
    </div>

    <div class="dashboard">
        <div class="bonus-box" id="box-my"><span>MAGNOLIA</span><b id="tot-my">0</b></div>
        <div class="actions">
            <button class="btn-ctrl" onclick="nextQ()">⏱️</button>
            <button id="voice-btn" class="btn-ctrl btn-voice" onclick="toggleVoice()">🎤</button>
            <button class="btn-ctrl" onclick="openSetup()">⚙️</button>
        </div>
        <div class="bonus-box" id="box-opp"><span id="opp-label">AVVERSARI</span><b id="tot-opp">0</b></div>
    </div>

    <div class="court">
        <div id="grid-my"></div>
        <div id="grid-opp"></div>
    </div>

    <script>
        let myT = JSON.parse(localStorage.getItem('M_ROSTER')) || [{id:1, n:"4", nm:"PLAY", on:true}];
        let opT = JSON.parse(localStorage.getItem('O_ROSTER')) || [{id:101, n:"4", on:true}];
        let f = JSON.parse(localStorage.getItem('F_DATA')) || {};
        let bM = parseInt(localStorage.getItem('BM')) || 0;
        let bO = parseInt(localStorage.getItem('BO')) || 0;
        let oppN = localStorage.getItem('OPP_N') || "AVVERSARI";

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let rec;

        function showStatus(msg) {
            const s = document.getElementById('voice-status');
            s.innerText = msg; s.style.display = 'block';
            setTimeout(() => { s.style.display = 'none'; }, 2500);
        }

        function toggleVoice() {
            if (!SpeechRecognition) return alert("No Voice Support");
            if (rec) rec.stop();
            rec = new SpeechRecognition();
            rec.lang = 'it-IT';
            rec.onstart = () => document.getElementById('voice-btn').classList.add('listening');
            rec.onresult = (e) => {
                const text = e.results[0][0].transcript.toLowerCase();
                showStatus("Ho capito: " + text);
                parseVoice(text);
            };
            rec.onend = () => document.getElementById('voice-btn').classList.remove('listening');
            rec.start();
        }

        function parseVoice(t) {
            const numMap = {"zero":0,"uno":1,"due":2,"tre":3,"quattro":4,"cinque":5,"sei":6,"sette":7,"otto":8,"nove":9,"dieci":10};
            let n = t.match(/\d+/);
            if (!n) { for (let k in numMap) { if (t.includes(k)) { n = [numMap[k]]; break; } } }
            if (!n) return;
            let target = n[0];
            let isO = (t.includes('avversari') || t.includes('rossi') || t.includes('loro'));
            const list = isO ? opT : myT;
            const p = list.find(x => x.n == target && x.on);
            if (p) change(p.id, 1, isO ? 'opp' : 'my');
        }

        function render() {
            const draw = (elId, list, type) => {
                const container = document.getElementById(elId); container.innerHTML = '';
                [...list].sort((a,b)=>parseInt(a.n)-parseInt(b.n)).forEach(p => {
                    if (!p.on) return;
                    if (f[p.id] === undefined) f[p.id] = 0;
                    const card = document.createElement('div');
                    card.className = `p-card ${type==='opp'?'opp':''} ${f[p.id]==4?'warning':''} ${f[p.id]==5?'out':''}`;
                    card.innerHTML = `
                        <div class="p-data" onclick="change(${p.id},1,'${type}')">
                            <div style="text-align:center"><small style="font-size:0.5rem;display:block">${p.nm||''}</small><span class="p-num">${p.n}</span></div>
                            <span class="p-fouls">${f[p.id]}</span>
                        </div>
                        <div class="p-btns">
                            <button class="btn-p btn-plus" onclick="change(${p.id},1,'${type}')">+</button>
                            <button class="btn-p btn-min" onclick="change(${p.id},-1,'${type}')">-</button>
                        </div>`;
                    container.appendChild(card);
                });
            };
            draw('grid-my', myT, 'my'); draw('grid-opp', opT, 'opp');
            document.getElementById('tot-my').innerText = bM;
            document.getElementById('tot-opp').innerText = bO;
            document.getElementById('opp-label').innerText = oppN;
            document.getElementById('box-my').classList.toggle('is-bonus', bM>=4);
            document.getElementById('box-opp').classList.toggle('is-bonus', bO>=4);
        }

        function change(id, d, type) {
            if (d < 0 && !confirm("Togliere fallo?")) return;
            let current = f[id] || 0;
            let val = Math.min(Math.max(current + d, 0), 5);
            if (d > 0 && current < 5) { type === 'my' ? bM++ : bO++; if(navigator.vibrate) navigator.vibrate(50); }
            else if (d < 0 && current > 0) { type === 'my' ? bM-- : bO--; }
            f[id] = val; save(); render();
        }

        function save() {
            localStorage.setItem('F_DATA', JSON.stringify(f));
            localStorage.setItem('BM', bM); localStorage.setItem('BO', bO);
            localStorage.setItem('M_ROSTER', JSON.stringify(myT));
            localStorage.setItem('O_ROSTER', JSON.stringify(opT));
            localStorage.setItem('OPP_N', oppN);
        }

        function addP(type) { 
            const id = Date.now(); 
            if(type==='my') myT.push({id, n:"0", nm:"NOME", on:true}); 
            else opT.push({id, n:"0", on:true}); 
            drawS(); 
        }

        function drawS() {
            const s = (el, list, type) => {
                const container = document.getElementById(el); container.innerHTML = '';
                list.forEach(p => {
                    const r = document.createElement('div'); r.className = 'setup-row';
                    r.innerHTML = `
                        <input type="checkbox" ${p.on?'checked':''} onchange="p.on=this.checked;save()">
                        <input type="text" style="width:30px" value="${p.n}" onchange="p.n=this.value;save()">
                        ${type==='my' ? `<input type="text" style="flex:1" value="${p.nm}" onchange="p.nm=this.value;save()">` : ''}
                        <button onclick="del(${p.id},'${type}')" style="color:red;background:none;border:none">X</button>`;
                    container.appendChild(r);
                });
            };
            s('setup-list-my', myT, 'my'); s('setup-list-opp', opT, 'opp');
        }

        function del(id, type) {
            if (type==='my') myT = myT.filter(x=>x.id!==id); else opT = opT.filter(x=>x.id!==id);
            drawS(); save();
        }

        function openSetup() { document.getElementById('setup-overlay').style.display='flex'; drawS(); }
        function closeSetup() { document.getElementById('setup-overlay').style.display='none'; render(); }
        function nextQ() { if(confirm("Reset Bonus?")) { bM=0; bO=0; save(); render(); } }
        function fullReset() { if(confirm("Azzera tutto?")) { f={}; bM=0; bO=0; save(); render(); closeSetup(); } }

        openSetup();
    </script>
</body>
</html>
